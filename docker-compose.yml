services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: b3s
      POSTGRES_PASSWORD: b3s
      POSTGRES_DB: b3s
    ports:
      - "5433:5432"
    volumes:
      - b3s_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b3s -d b3s"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  b3s_pgdata:
