[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "b3s"
version = "0.1.0"
description = "Brand evidence lab"
requires-python = ">=3.11"
dependencies = [
  "exa-py>=1.8.8",
  "fastapi>=0.115.0",
  "firecrawl-py>=4.0,<5",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.4",
  "pillow>=10.0,<12",
  "playwright>=1.44.0,<2",
  "psycopg[binary]>=3.2.10,<4",
  "pydantic-settings>=2.5.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff==0.15.18",
]

[tool.setuptools.package-data]
"web" = ["templates/*.j2", "static/*"]
"src.history" = ["migrations/*.sql"]
"src.sv9_flow" = ["policy_data/*.json"]

[tool.setuptools.packages.find]
include = ["src", "src.*", "web", "web.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
