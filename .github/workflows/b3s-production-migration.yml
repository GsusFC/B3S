name: B3S production migration

on:
  workflow_dispatch:
    inputs:
      migration_sha:
        description: "Exact current main SHA to migrate"
        required: true
        type: string

concurrency:
  group: b3s-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: production-migration
    permissions:
      contents: read
    steps:
      - name: Attest live main before checkout
        env:
          API_URL: ${{ github.api_url }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          GH_REPOSITORY: ${{ github.repository }}
          MIGRATION_SHA: ${{ inputs.migration_sha }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = "refs/heads/main"
          printf '%s' "$MIGRATION_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$DISPATCH_SHA" | grep -Eq '^[0-9a-f]{40}$'
          main_ref="$(curl --fail --silent --show-error "$API_URL/repos/$GH_REPOSITORY/git/ref/heads/main")"
          live_main="$(printf '%s' "$main_ref" | python3 -c 'import json, sys; print(json.load(sys.stdin)["object"]["sha"])')"
          printf '%s' "$live_main" | grep -Eq '^[0-9a-f]{40}$'
          test "$MIGRATION_SHA" = "$live_main"
          test "$MIGRATION_SHA" = "$DISPATCH_SHA"
          test "$DISPATCH_SHA" = "$live_main"

      - name: Checkout attested source without credentials
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          MIGRATION_SHA: ${{ inputs.migration_sha }}
        run: |
          set -euo pipefail
          git init --quiet .
          git remote add origin "$GITHUB_SERVER_URL/$GH_REPOSITORY.git"
          git fetch --depth=1 origin "$MIGRATION_SHA"
          git checkout --detach FETCH_HEAD

      - name: Verify checked-out migration source
        env:
          DISPATCH_SHA: ${{ github.sha }}
          MIGRATION_SHA: ${{ inputs.migration_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MIGRATION_SHA"
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install hash-locked migration dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes --no-deps -r requirements-b3s-production-migration.txt

      - name: Run target-pinned migration and postflight receipt
        env:
          B3S_MIGRATION_DATABASE_URL: ${{ secrets.B3S_MIGRATION_DATABASE_URL }}
          B3S_PRODUCTION_TLS_ROOT_CERT: ${{ secrets.B3S_PRODUCTION_TLS_ROOT_CERT }}
          B3S_PRODUCTION_DATABASE: ${{ vars.B3S_PRODUCTION_DATABASE }}
          B3S_PRODUCTION_HOST: ${{ vars.B3S_PRODUCTION_HOST }}
          B3S_PRODUCTION_NEON_PROJECT_ID: ${{ vars.B3S_PRODUCTION_NEON_PROJECT_ID }}
          B3S_PRODUCTION_NEON_BRANCH_ID: ${{ vars.B3S_PRODUCTION_NEON_BRANCH_ID }}
          B3S_PRODUCTION_MIGRATION_ROLE: ${{ vars.B3S_PRODUCTION_MIGRATION_ROLE }}
        run: |
          set -euo pipefail
          python scripts/run_b3s_production_migration.py
