name: Temporary live Vault WebMCP smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/live-webmcp-smoke-temp.yml"

permissions:
  contents: read

concurrency:
  group: live-webmcp-smoke-vault
  cancel-in-progress: false

jobs:
  live-stagehand:
    name: Isolate live Vault WebMCP result transport
    if: >-
      ${{
        github.repository == 'GsusFC/B3S' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'ops/live-webmcp-smoke-vault' &&
        github.event.pull_request.base.ref == 'main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PUPPETEER_SKIP_DOWNLOAD: "1"
      VAULT_URL: https://b3s-vault.fly.dev
      BROWSERBASE_SKILLS_SHA: 6811ca31163332d9d60309cff48e77f09de37a17

    steps:
      - name: Check out controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v5.0.0
        with:
          node-version: 22.18.0

      - name: Install pinned Stagehand
        shell: bash
        run: |
          set -euo pipefail
          validator_root="$RUNNER_TEMP/browserbase-skills"
          git init "$validator_root"
          git -C "$validator_root" remote add origin https://github.com/browserbase/skills.git
          git -C "$validator_root" fetch --depth 1 origin "$BROWSERBASE_SKILLS_SHA"
          git -C "$validator_root" checkout --detach FETCH_HEAD
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm --dir "$validator_root/skills/add-webmcp" install --frozen-lockfile
          echo "VALIDATOR_ROOT=$validator_root" >> "$GITHUB_ENV"

      - name: Inspect tool output shape and underlying brand document
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome_path"
          export CHROME_PATH="$chrome_path"

          probe="$VALIDATOR_ROOT/skills/add-webmcp/live-output-shape.mjs"
          cat > "$probe" <<'JS'
          import process from "node:process";
          import { localBrowser, Stagehand } from "@browserbasehq/stagehand";

          const describe = (value) => {
            const kind = value === null ? "null" : Array.isArray(value) ? "array" : typeof value;
            let keys = [];
            if (value && typeof value === "object" && !Array.isArray(value)) {
              keys = Object.keys(value).slice(0, 20);
            }
            let serializedLength = null;
            try {
              serializedLength = JSON.stringify(value).length;
            } catch {
              serializedLength = null;
            }
            let parseableJsonString = false;
            let parsedKeys = [];
            if (typeof value === "string") {
              try {
                const parsed = JSON.parse(value);
                parseableJsonString = true;
                if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
                  parsedKeys = Object.keys(parsed).slice(0, 20);
                }
              } catch {
                // Shape only; do not print the returned content.
              }
            }
            return { kind, keys, serializedLength, parseableJsonString, parsedKeys };
          };

          const browser = await localBrowser.launch({
            headless: true,
            chromiumSandbox: false,
            executablePath: process.env.CHROME_PATH,
          });
          let stagehand;
          const failures = [];
          try {
            stagehand = await Stagehand.create({ browser });
            const pages = await stagehand.browser.context.pages();
            const page = pages[0] ?? (await stagehand.browser.context.newPage());
            await page.goto(`${process.env.VAULT_URL}/`, { waitUntil: "load" });
            const tools = await page.tools({ timeout: 10_000 });
            const byName = (name) => tools.find((tool) => tool.name === name);
            const invoke = async (name, input) => {
              const tool = byName(name);
              if (!tool) throw new Error(`missing tool ${name}`);
              const invocation = await tool.invoke({ input });
              return invocation.result({ timeout: 15_000 });
            };

            const list = await invoke("b3s_list_brand_analyses", { limit: 1 });
            const domain = String(list.output?.analyses?.[0]?.domain || "");
            if (list.status !== "Completed" || !domain) {
              throw new Error("cannot select a live analysis for transport diagnosis");
            }
            console.log(`LIST_SHAPE ${JSON.stringify(describe(list.output))}`);
            console.log(`SELECTED_DOMAIN_META ${JSON.stringify({ length: domain.length, hasWww: domain.toLowerCase().startsWith("www."), hasDot: domain.includes(".") })}`);

            const liveBrand = await invoke("b3s_get_brand_analysis", { domain });
            console.log(`LIVE_BRAND_STATUS ${liveBrand.status}`);
            console.log(`LIVE_BRAND_OUTPUT_SHAPE ${JSON.stringify(describe(liveBrand.output))}`);

            const emptyBrand = await invoke("b3s_get_brand_analysis", { domain: "webmcp-no-report.invalid" });
            console.log(`EMPTY_BRAND_STATUS ${emptyBrand.status}`);
            console.log(`EMPTY_BRAND_OUTPUT_SHAPE ${JSON.stringify(describe(emptyBrand.output))}`);

            const documentProbe = await page.evaluate(async (selectedDomain) => {
              const response = await fetch(`/brand/${encodeURIComponent(selectedDomain)}?lang=es`, {
                credentials: "same-origin",
                headers: { Accept: "text/html" },
              });
              const markup = await response.text();
              const doc = new DOMParser().parseFromString(markup, "text/html");
              return {
                status: response.status,
                ok: response.ok,
                finalPath: new URL(response.url).pathname,
                contentType: response.headers.get("content-type") || "",
                markupLength: markup.length,
                hasBrandTitle: Boolean(doc.querySelector(".brand-profile-title")),
                hasBrandDomain: Boolean(doc.querySelector(".brand-profile-domain-link")),
                brandDomainTextLength: String(doc.querySelector(".brand-profile-domain-link")?.textContent || "").trim().length,
                hasVaultMemory: Boolean(doc.querySelector("#memoria-vault")),
                hasReportLink: Boolean(doc.querySelector('.brand-profile-terminal a[href^="/report/"]')),
                hasIndexTable: Boolean(doc.querySelector("table.reports-table")),
              };
            }, domain);
            console.log(`DIRECT_BRAND_DOCUMENT ${JSON.stringify(documentProbe)}`);

            if (liveBrand.status !== "Completed") failures.push("live brand tool did not complete");
            if (emptyBrand.status !== "Completed") failures.push("empty brand tool did not complete");
            if (!documentProbe.ok || !documentProbe.hasBrandTitle || !documentProbe.hasBrandDomain) {
              failures.push("underlying brand document is not the expected page");
            }
            if (failures.length === 0) {
              console.log("PASS transport isolation completed without invoking any mutation");
            }
          } finally {
            await stagehand?.close().catch(() => {});
            await browser.close().catch(() => {});
          }

          if (failures.length) {
            for (const failure of failures) console.error(`FAIL ${failure}`);
            process.exitCode = 1;
          }
          JS

          node "$probe"

      - name: Record safety boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Live WebMCP transport diagnostic"
            echo "- Read-only tools only"
            echo "- No scan preparation, continuation, cancellation, provider call or data mutation"
          } >> "$GITHUB_STEP_SUMMARY"
