name: Deploy isolated PR71 Vault after merge

on:
  workflow_dispatch:
    inputs:
      deployment_sha:
        description: "Exact current main commit SHA to deploy"
        required: true
        type: string
      confirm_app:
        description: "Type b3s-pr71-vault"
        required: true
        type: string

concurrency:
  group: fly-deploy-b3s-pr71-vault
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_app == 'b3s-pr71-vault' }}
    runs-on: ubuntu-latest
    environment:
      name: pr71-vault
      url: https://b3s-pr71-vault.fly.dev
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      # This step uses only runner-owned code and the GitHub API. Do not check
      # out, install, or expose deployment secrets until the exact PR, ancestry,
      # changed-file allowlist, trusted CI blobs, and successful CI runs attest.
      - name: Attest PR71 ancestry and current main before checkout
        env:
          API_URL: ${{ github.api_url }}
          DEPLOY_SHA: ${{ inputs.deployment_sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TRUSTED_PR_HEAD_SHA: 377364784ee9b4554acd074a7013e870191654e0
          TRUSTED_PR_MERGE_SHA: 05393b5eac7fa7be68f5739eba92becb40619a50
          TRUSTED_CI_BLOB_SHA: c1082f6b5c53a364b8d38e43936b93722c0183d1
          TRUSTED_REPOSITORY_ID: "1288696741"
          TRUSTED_CI_WORKFLOW_ID: "306885838"
          TRUSTED_PR_CI_RUN_ID: "31496647341"
          TRUSTED_MERGE_CI_RUN_ID: "31506929921"
        run: |
          set -euo pipefail
          umask 077
          attestation_dir="$(mktemp -d "$RUNNER_TEMP/pr71-attestation.XXXXXX")"
          trap 'rm -rf "$attestation_dir"' EXIT

          api_get() {
            output="$1"
            url="$2"
            curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$output" \
              "$url"
          }

          pr_file="$attestation_dir/pr.json"
          main_ref_file="$attestation_dir/main-ref.json"
          workflow_file="$attestation_dir/workflow.json"
          head_ci_file="$attestation_dir/head-ci.json"
          merge_ci_file="$attestation_dir/merge-ci.json"
          deploy_ci_file="$attestation_dir/deploy-ci.json"
          head_merge_compare_file="$attestation_dir/head-merge-compare.json"
          merge_deploy_compare_file="$attestation_dir/merge-deploy-compare.json"
          pr_ci_run_file="$attestation_dir/pr-ci-run.json"
          merge_ci_run_file="$attestation_dir/merge-ci-run.json"
          deployment_ci_runs_file="$attestation_dir/deployment-ci-runs.json"

          api_get "$pr_file" "$API_URL/repos/$GH_REPOSITORY/pulls/71"
          api_get "$main_ref_file" "$API_URL/repos/$GH_REPOSITORY/git/ref/heads/main"
          api_get "$workflow_file" "$API_URL/repos/$GH_REPOSITORY/actions/workflows/ci.yml"
          api_get "$head_ci_file" "$API_URL/repos/$GH_REPOSITORY/contents/.github/workflows/ci.yml?ref=$TRUSTED_PR_HEAD_SHA"
          api_get "$merge_ci_file" "$API_URL/repos/$GH_REPOSITORY/contents/.github/workflows/ci.yml?ref=$TRUSTED_PR_MERGE_SHA"
          api_get "$deploy_ci_file" "$API_URL/repos/$GH_REPOSITORY/contents/.github/workflows/ci.yml?ref=$DEPLOY_SHA"
          api_get "$head_merge_compare_file" "$API_URL/repos/$GH_REPOSITORY/compare/$TRUSTED_PR_HEAD_SHA...$TRUSTED_PR_MERGE_SHA?per_page=100&page=1"
          api_get "$merge_deploy_compare_file" "$API_URL/repos/$GH_REPOSITORY/compare/$TRUSTED_PR_MERGE_SHA...$DEPLOY_SHA?per_page=100&page=1"
          api_get "$pr_ci_run_file" "$API_URL/repos/$GH_REPOSITORY/actions/runs/$TRUSTED_PR_CI_RUN_ID"
          api_get "$merge_ci_run_file" "$API_URL/repos/$GH_REPOSITORY/actions/runs/$TRUSTED_MERGE_CI_RUN_ID"
          api_get "$deployment_ci_runs_file" "$API_URL/repos/$GH_REPOSITORY/actions/workflows/$TRUSTED_CI_WORKFLOW_ID/runs?event=push&branch=main&head_sha=$DEPLOY_SHA&per_page=100"

          PR_FILE="$pr_file" \
          MAIN_REF_FILE="$main_ref_file" \
          WORKFLOW_FILE="$workflow_file" \
          HEAD_CI_FILE="$head_ci_file" \
          MERGE_CI_FILE="$merge_ci_file" \
          DEPLOY_CI_FILE="$deploy_ci_file" \
          HEAD_MERGE_COMPARE_FILE="$head_merge_compare_file" \
          MERGE_DEPLOY_COMPARE_FILE="$merge_deploy_compare_file" \
          PR_CI_RUN_FILE="$pr_ci_run_file" \
          MERGE_CI_RUN_FILE="$merge_ci_run_file" \
          DEPLOYMENT_CI_RUNS_FILE="$deployment_ci_runs_file" \
          python - <<'PY'
          import json
          import os
          import re

          SHA_RE = re.compile(r"[0-9a-f]{40}")
          CI_PATH = ".github/workflows/ci.yml"
          HOTFIX_FILES = {
              ".github/workflows/fly-deploy-pr71-vault.yml",
              "docs/deployment/b3s_pr71_vault.md",
              "scripts/pr71_vault_database_target.py",
              "tests/test_configure_b3s_runtime_role.py",
              "tests/test_deploy_provenance.py",
              "tests/test_pr71_vault_deploy_target.py",
              "tests/test_pr71_vault_migration_target.py",
          }

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def exact_int(value, expected, message):
              require(
                  isinstance(value, int)
                  and not isinstance(value, bool)
                  and value == expected,
                  message,
              )

          def sha_env(name):
              value = os.environ[name]
              require(SHA_RE.fullmatch(value) is not None, f"{name} is not an exact SHA")
              return value

          def load_object(name):
              with open(os.environ[name], encoding="utf-8") as handle:
                  value = json.load(handle)
              require(isinstance(value, dict), f"{name} response must be an object")
              return value

          repository = os.environ["GH_REPOSITORY"]
          deploy_sha = sha_env("DEPLOY_SHA")
          dispatch_sha = sha_env("DISPATCH_SHA")
          trusted_head = sha_env("TRUSTED_PR_HEAD_SHA")
          trusted_merge = sha_env("TRUSTED_PR_MERGE_SHA")
          trusted_blob = sha_env("TRUSTED_CI_BLOB_SHA")
          trusted_repository_id = int(os.environ["TRUSTED_REPOSITORY_ID"])
          trusted_workflow_id = int(os.environ["TRUSTED_CI_WORKFLOW_ID"])
          trusted_pr_run_id = int(os.environ["TRUSTED_PR_CI_RUN_ID"])
          trusted_merge_run_id = int(os.environ["TRUSTED_MERGE_CI_RUN_ID"])

          require(
              os.environ["DISPATCH_REF"] == "refs/heads/main",
              "deployment workflow must be dispatched from refs/heads/main",
          )
          require(deploy_sha == dispatch_sha, "deployment_sha is not the dispatched main SHA")

          pr = load_object("PR_FILE")
          exact_int(pr.get("number"), 71, "unexpected pull request object")
          require(pr.get("state") == "closed", "PR71 must be closed")
          require(pr.get("merged") is True, "PR71 must be merged")
          require(pr.get("draft") is False, "PR71 must not be a draft")
          base = pr.get("base")
          head = pr.get("head")
          require(isinstance(base, dict), "PR71 base must be present")
          require(isinstance(head, dict), "PR71 head must be present")
          require(base.get("ref") == "main", "PR71 base ref must be main")
          require(head.get("ref") == "fix/vault-v2-cumulative-landing", "PR71 head ref is not exact")
          require(head.get("sha") == trusted_head, "PR71 reviewed head SHA is not exact")
          require(pr.get("merge_commit_sha") == trusted_merge, "PR71 merge commit SHA is not exact")
          for label, side in (("base", base), ("head", head)):
              repo = side.get("repo")
              require(isinstance(repo, dict), f"PR71 {label} repository is missing")
              exact_int(repo.get("id"), trusted_repository_id, f"PR71 {label} repository id is not exact")
              require(repo.get("full_name") == repository, f"PR71 {label} repository name is not exact")

          main_ref = load_object("MAIN_REF_FILE")
          require(main_ref.get("ref") == "refs/heads/main", "unexpected main ref")
          main_object = main_ref.get("object")
          require(isinstance(main_object, dict), "main ref object is missing")
          require(main_object.get("type") == "commit", "main must resolve to a commit")
          require(main_object.get("sha") == deploy_sha, "deployment_sha is not current main")

          workflow = load_object("WORKFLOW_FILE")
          exact_int(workflow.get("id"), trusted_workflow_id, "trusted CI workflow id is not exact")
          require(workflow.get("path") == CI_PATH, "trusted CI workflow path is not exact")
          require(workflow.get("state") == "active", "trusted CI workflow is not active")

          for label, env_name in (
              ("reviewed head", "HEAD_CI_FILE"),
              ("PR71 merge", "MERGE_CI_FILE"),
              ("deployment", "DEPLOY_CI_FILE"),
          ):
              blob = load_object(env_name)
              require(blob.get("type") == "file", f"{label} CI object must be a file")
              require(blob.get("path") == CI_PATH, f"{label} CI path is not exact")
              require(blob.get("sha") == trusted_blob, f"{label} CI blob SHA is not trusted")

          def attest_ancestry(payload, base_sha, head_sha, label, expected_files):
              require(payload.get("status") in {"ahead", "identical"}, f"{label} status is not ancestral")
              exact_int(payload.get("behind_by"), 0, f"{label} is behind its base")
              require(payload.get("base_commit", {}).get("sha") == base_sha, f"{label} base commit is not exact")
              require(payload.get("merge_base_commit", {}).get("sha") == base_sha, f"{label} merge base is not exact")
              ahead_by = payload.get("ahead_by")
              total_commits = payload.get("total_commits")
              require(
                  isinstance(ahead_by, int)
                  and not isinstance(ahead_by, bool)
                  and 1 <= ahead_by <= 100,
                  f"{label} commit count is outside the attested page",
              )
              exact_int(total_commits, ahead_by, f"{label} total commit count is inconsistent")
              commits = payload.get("commits")
              require(isinstance(commits, list) and len(commits) == ahead_by, f"{label} commit page is incomplete")
              require(all(isinstance(item, dict) for item in commits), f"{label} commits are malformed")
              require(commits[-1].get("sha") == head_sha, f"{label} head commit is not exact")
              if expected_files is not None:
                  files = payload.get("files")
                  require(isinstance(files, list) and len(files) < 300, f"{label} file page is missing or truncated")
                  require(all(isinstance(item, dict) for item in files), f"{label} files are malformed")
                  filenames = {item.get("filename") for item in files}
                  require(filenames == expected_files and len(files) == len(expected_files), f"{label} changed files are not exact")
                  require(all(item.get("status") == "modified" for item in files), f"{label} contains a non-modified allowlisted file")
                  require(all("previous_filename" not in item for item in files), f"{label} contains a renamed file")

          head_merge_compare = load_object("HEAD_MERGE_COMPARE_FILE")
          attest_ancestry(head_merge_compare, trusted_head, trusted_merge, "reviewed-head-to-merge", None)
          merge_deploy_compare = load_object("MERGE_DEPLOY_COMPARE_FILE")
          attest_ancestry(merge_deploy_compare, trusted_merge, deploy_sha, "merge-to-deployment", HOTFIX_FILES)

          def attest_run(run, expected):
              require(isinstance(run, dict), f"{expected['label']} run must be an object")
              for field, value in expected["fields"].items():
                  if isinstance(value, int):
                      exact_int(run.get(field), value, f"{expected['label']} run has unexpected {field}")
                  else:
                      require(run.get(field) == value, f"{expected['label']} run has unexpected {field}")
              for field in ("repository", "head_repository"):
                  repo = run.get(field)
                  require(isinstance(repo, dict), f"{expected['label']} run has malformed {field}")
                  exact_int(repo.get("id"), trusted_repository_id, f"{expected['label']} run has unexpected {field} id")
                  require(repo.get("full_name") == repository, f"{expected['label']} run has unexpected {field} name")

          common = {
              "workflow_id": trusted_workflow_id,
              "path": CI_PATH,
              "status": "completed",
              "conclusion": "success",
              "run_attempt": 1,
          }
          attest_run(
              load_object("PR_CI_RUN_FILE"),
              {"label": "reviewed PR71", "fields": {
                  **common,
                  "id": trusted_pr_run_id,
                  "event": "pull_request",
                  "head_branch": "fix/vault-v2-cumulative-landing",
                  "head_sha": trusted_head,
              }},
          )
          attest_run(
              load_object("MERGE_CI_RUN_FILE"),
              {"label": "PR71 merge", "fields": {
                  **common,
                  "id": trusted_merge_run_id,
                  "event": "push",
                  "head_branch": "main",
                  "head_sha": trusted_merge,
              }},
          )

          deployment_runs = load_object("DEPLOYMENT_CI_RUNS_FILE")
          runs = deployment_runs.get("workflow_runs")
          exact_int(deployment_runs.get("total_count"), 1, "current deployment CI run is missing or ambiguous")
          require(isinstance(runs, list) and len(runs) == 1, "current deployment CI run list is missing or ambiguous")
          current_run = runs[0]
          require(isinstance(current_run, dict), "current deployment CI run is malformed")
          current_run_id = current_run.get("id")
          require(isinstance(current_run_id, int) and not isinstance(current_run_id, bool) and current_run_id > 0, "current deployment CI run id is invalid")
          attest_run(
              current_run,
              {"label": "current deployment", "fields": {
                  **common,
                  "id": current_run_id,
                  "event": "push",
                  "head_branch": "main",
                  "head_sha": deploy_sha,
              }},
          )
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.deployment_sha }}
          persist-credentials: false

      - name: Verify checked-out source and isolated target
        env:
          DEPLOY_SHA: ${{ inputs.deployment_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test -z "$(git status --porcelain)"
          test "$(sed -n 's/^app = "\([^"]*\)"/\1/p' fly.pr71-vault.toml)" = "b3s-pr71-vault"
          grep -Fq 'source = "b3s_pr71_vault_data"' fly.pr71-vault.toml
          grep -Fq 'B3S_EXPECTED_NEON_BRANCH_ID = "br-divine-star-aspobuer"' fly.pr71-vault.toml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install release package
        run: python -m pip install --disable-pip-version-check .

      - name: Migrate the attested database and configure its runtime role
        env:
          B3S_MIGRATION_DATABASE_URL: ${{ secrets.B3S_MIGRATION_DATABASE_URL }}
        run: |
          set -eu
          python scripts/migrate_b3s_history_postgres.py \
            --target-profile pr71-vault
          python scripts/configure_b3s_runtime_role.py \
            --target-profile pr71-vault \
            --role b3s_pr71_app_runtime \
            --database-name neondb

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master pinned 2026-07-27

      - name: Validate isolated Fly configuration
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl config validate -a b3s-pr71-vault -c fly.pr71-vault.toml

      - name: Deploy exact image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DEPLOY_SHA: ${{ inputs.deployment_sha }}
        run: >-
          flyctl deploy --remote-only
          -a b3s-pr71-vault
          -c fly.pr71-vault.toml
          --build-arg B3S_BUILD_SHA="$DEPLOY_SHA"

      - name: Verify public liveness and exact commit
        env:
          DEPLOY_SHA: ${{ inputs.deployment_sha }}
        run: |
          for attempt in $(seq 1 24); do
            observed="$(curl --fail --silent --show-error https://b3s-pr71-vault.fly.dev/health | python -c 'import json,sys; print(json.load(sys.stdin).get("commit_sha", ""))')" || observed=""
            test "$observed" = "$DEPLOY_SHA" && exit 0
            sleep 5
          done
          echo "::error::Isolated Vault did not publish the expected commit"
          exit 1
