name: Fly Deploy

# Manual production rollout is always available from main. Automatic deploys
# run only after green CI when AUTO_DEPLOY_ENABLED is explicitly set to true.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main

concurrency:
  group: fly-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy app
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event.workflow_run.conclusion == 'success' && vars.AUTO_DEPLOY_ENABLED == 'true')
      }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://b3s.fly.dev
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Automatic runs deploy the exact CI-verified SHA. A manual run deploys
          # the selected branch SHA, which must remain main during guarded rollout.
          ref: ${{ env.DEPLOY_SHA }}

      - name: Verify deployment source
        run: |
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test -z "$(git status --porcelain)"

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master pinned 2026-07-27

      - name: Validate Fly configuration
        run: flyctl config validate -a b3s
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly
        run: flyctl deploy --remote-only -a b3s --build-arg B3S_BUILD_SHA="$DEPLOY_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployed commit
        run: |
          observed=""
          for attempt in $(seq 1 24); do
            observed="$(curl --fail --silent --show-error https://b3s.fly.dev/health | python3 -c 'import json, sys; print(json.load(sys.stdin).get("commit_sha", ""))')" || observed=""
            if [ "$observed" = "$DEPLOY_SHA" ]; then
              echo "Verified production commit $DEPLOY_SHA"
              exit 0
            fi
            echo "Waiting for production commit (attempt $attempt/24; observed: ${observed:-unavailable})"
            sleep 5
          done
          echo "::error::Expected production commit $DEPLOY_SHA, observed ${observed:-unavailable}"
          exit 1
