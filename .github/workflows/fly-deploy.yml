name: Fly Deploy

# Manual production rollout is always available from main. Automatic deploys
# run only after green CI when AUTO_DEPLOY_ENABLED is explicitly set to true.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main

concurrency:
  group: fly-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy app
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event.workflow_run.conclusion == 'success' && vars.AUTO_DEPLOY_ENABLED == 'true')
      }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://b3s.fly.dev
    steps:
      - uses: actions/checkout@v4
        with:
          # Automatic runs deploy the exact CI-verified SHA. A manual run deploys
          # the selected branch SHA, which must remain main during guarded rollout.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate Fly configuration
        run: flyctl config validate -a b3s
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly
        run: flyctl deploy --remote-only -a b3s
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
