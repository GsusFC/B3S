name: One-time verify WebMCP on b3s-vault

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/deploy-b3s-vault-webmcp-once.yml"

permissions:
  contents: read

concurrency:
  group: verify-b3s-vault-webmcp-184502a
  cancel-in-progress: false

jobs:
  verify:
    name: Verify live WebMCP and Vault credential
    if: >-
      ${{
        github.repository == 'GsusFC/B3S' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'ops/deploy-b3s-vault-webmcp-184502a-v2' &&
        github.event.pull_request.base.ref == 'main' &&
        github.actor == 'GsusFC'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: b3s-vault
    env:
      WEBMCP_SHA: 184502a46ce0c9660285803e94a46491eac6c8df
      VAULT_APP: b3s-vault
      VAULT_URL: https://b3s-vault.fly.dev
      PRODUCTION_URL: https://b3s.fly.dev

    steps:
      - name: Check out the reviewed WebMCP source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.WEBMCP_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify reviewed WebMCP source markers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WEBMCP_SHA"
          test -z "$(git status --porcelain)"
          test -f web/static/vault_webmcp.js
          test -f web/static/vault_webmcp_loader.js
          grep -Fq 'b3s_prepare_scan' web/static/vault_webmcp.js
          grep -Fq 'b3s_list_vault_review_cases' web/static/vault_webmcp.js
          grep -Fq 'https://b3s-vault.fly.dev' web/static/vault_webmcp_loader.js

      - name: Install pinned Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # pinned 2026-07-27

      - name: Verify credential, app and persistent volume
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          flyctl status -a "$VAULT_APP"
          flyctl volumes list -a "$VAULT_APP" --json > "$RUNNER_TEMP/vault-volumes.json"
          python3 - "$RUNNER_TEMP/vault-volumes.json" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          names = set()
          def visit(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if str(key).casefold() == "name" and isinstance(child, str):
                          names.add(child)
                      visit(child)
              elif isinstance(value, list):
                  for child in value:
                      visit(child)
          visit(payload)
          assert "b3s_vault_data" in names, f"missing b3s_vault_data; observed={sorted(names)}"
          PY

      - name: Verify live Vault descends from WebMCP and production is unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          read_health() {
            local base_url="$1"
            curl --fail --silent --show-error --max-time 20 "$base_url/health" \
              | python3 -c 'import json, re, sys; payload=json.load(sys.stdin); sha=str(payload.get("commit_sha") or ""); assert payload.get("status") == "ok"; assert re.fullmatch(r"[0-9a-f]{40}", sha); print(sha)'
          }

          production_before="$(read_health "$PRODUCTION_URL")"
          vault_sha="$(read_health "$VAULT_URL")"
          echo "Production baseline: $production_before"
          echo "Vault live SHA: $vault_sha"

          comparison="$RUNNER_TEMP/webmcp-to-vault.json"
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$comparison" \
            "$API_URL/repos/$GH_REPOSITORY/compare/$WEBMCP_SHA...$vault_sha"

          VAULT_SHA="$vault_sha" python3 - "$comparison" <<'PY'
          import json
          import os
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          webmcp_sha = os.environ["WEBMCP_SHA"]
          vault_sha = os.environ["VAULT_SHA"]
          assert payload.get("status") in {"ahead", "identical"}
          assert payload.get("base_commit", {}).get("sha") == webmcp_sha
          assert payload.get("merge_base_commit", {}).get("sha") == webmcp_sha
          if vault_sha != webmcp_sha:
              commits = payload.get("commits") or []
              assert commits and commits[-1].get("sha") == vault_sha
          PY

          curl --fail --silent --show-error --max-time 20 \
            "$VAULT_URL/static/vault_webmcp_loader.js?sha=$vault_sha" \
            | grep -Fq 'https://b3s-vault.fly.dev'
          curl --fail --silent --show-error --max-time 20 \
            "$VAULT_URL/static/vault_webmcp.js?sha=$vault_sha" \
            | grep -Fq 'b3s_prepare_scan'
          curl --fail --silent --show-error --max-time 20 \
            "$VAULT_URL/static/vault_webmcp.js?sha=$vault_sha" \
            | grep -Fq 'b3s_list_vault_review_cases'

          production_after="$(read_health "$PRODUCTION_URL")"
          test "$production_after" = "$production_before"

          {
            echo "### B3S Vault WebMCP verification"
            echo "- Reviewed WebMCP ancestor: \`$WEBMCP_SHA\`"
            echo "- Live Vault commit: \`$vault_sha\`"
            echo "- Credential can access Fly app \`b3s-vault\`"
            echo "- Persistent volume \`b3s_vault_data\` present"
            echo "- WebMCP loader and tool module served live"
            echo "- Production unchanged: \`$production_after\`"
            echo "- No deployment or scan was executed"
          } >> "$GITHUB_STEP_SUMMARY"
