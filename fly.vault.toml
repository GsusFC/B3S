app = "b3s-vault"
primary_region = "cdg"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "sh -lc 'python scripts/verify_release_build.py && B3S_MIGRATION_DATABASE_URL=\"$B3S_DATABASE_URL\" python scripts/migrate_b3s_history_postgres.py --target-profile b3s-vault && python scripts/verify_b3s_history_postgres.py'"
  release_command_timeout = "5m"

[env]
  BRAND3_BASE_URL = "https://b3s-vault.fly.dev"
  BRAND3_DB_PATH = "/data/brand3.sqlite3"
  BRAND3_ENVIRONMENT = "vault"
  B3S_POSTGRES_REQUIRED = "true"
  BRAND3_VAULT_OPERATIONAL_PIPELINE_ENABLED = "true"
  BRAND3_VAULT_SV9_JUDGMENT_SHADOW_ENABLED = "true"
  BRAND3_SCREENSHOT_DIR = "/data/screenshots"
  B3S_REPORTS_DIR = "/data/reports"
  B3S_SCORING_DB_PATH = "/data/b3s_scoring.sqlite3"
  B3S_CANONICAL_ENFORCEMENT_MODE = "repeated"
  B3S_EVIDENCE_LEDGER_MODE = "shadow"
  B3S_EVIDENCE_CLAIM_TILE_LEDGER_MODE = "shadow"
  # No acquisition worker is launched by this deployment; shadow stays off.
  BRAND3_VAULT_VERIFIED_RAW_ACQUISITION_SHADOW_ENABLED = "false"
  BRAND3_VAULT_VERIFIED_RAW_ACQUISITION_SOCKET_PATH = ""
  SCREENSHOT_PROVIDER = "playwright"
  BRAND3_VISUAL_SCREENSHOT_TIMEOUT_SECONDS = "90"

[[mounts]]
  source = "b3s_vault_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
